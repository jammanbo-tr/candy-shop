<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Relay</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    h2 {
      margin-bottom: 16px;
    }
    .button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    .button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h2>🍬 Candy Shop 교실</h2>
  <button class="button" id="open-dashboard">대시보드 열기</button>
  <button class="button" id="open-settings">설정</button>

  <script>
    document.getElementById('open-dashboard').addEventListener('click', () => {
      chrome.runtime.openOptionsPage();
    });

    document.getElementById('open-settings').addEventListener('click', () => {
      chrome.runtime.openOptionsPage();
    });
  </script>
</body>
</html>
