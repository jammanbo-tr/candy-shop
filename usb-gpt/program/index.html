<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 반 소통채널 - 시연용</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light only;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gowun Dodum', 'Roboto', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, rgba(224,247,250,0.75) 0%, rgba(227,242,253,0.85) 100%), url('../media/image/TR_bg.png') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #123;
            overflow: hidden;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.4), rgba(255,255,255,0));
            pointer-events: none;
        }

        .container {
            z-index: 1;
            text-align: center;
            padding: 3rem clamp(1.5rem, 5vw, 4rem);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 28px 46px rgba(15, 76, 117, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
            max-width: 960px;
            width: min(92%, 960px);
            backdrop-filter: blur(12px);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-size: 0.95rem;
            font-weight: 700;
            color: #0d47a1;
            padding: 0.45rem 1.2rem;
            border-radius: 999px;
            background: rgba(33, 150, 243, 0.15);
            border: 1px solid rgba(33, 150, 243, 0.3);
            margin-bottom: 1.4rem;
        }

        .badge span {
            font-size: 1.1rem;
        }

        h1 {
            font-size: clamp(2.6rem, 4vw, 3.8rem);
            color: #1565c0;
            margin-bottom: 0.4rem;
            font-weight: 700;
            text-shadow: 2px 3px 10px rgba(21, 101, 192, 0.2);
        }

        .subtitle {
            font-size: clamp(1.1rem, 2.6vw, 1.5rem);
            color: #336699;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .target-grade {
            font-size: 1.2rem;
            color: #f57c00;
            font-weight: 700;
            margin-bottom: 2.6rem;
            background: linear-gradient(45deg, #ff9800, #ffcc80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.6rem;
            margin-bottom: 2.4rem;
        }

        .page-button {
            position: relative;
            overflow: hidden;
            padding: 2.1rem clamp(2rem, 6vw, 3.4rem);
            min-width: min(300px, 90vw);
            border-radius: 16px;
            border: none;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 700;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            color: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .page-button span.icon {
            font-size: 2.3rem;
        }

        .page-button:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 32px rgba(0, 0, 0, 0.15);
        }

        .teacher-button {
            background: linear-gradient(135deg, #1976d2, #0d47a1);
        }

        .student-button {
            background: linear-gradient(135deg, #43a047, #1b5e20);
        }

        .feature-section {
            border-top: 1px solid rgba(25, 118, 210, 0.12);
            padding-top: 2.4rem;
        }

        .feature-section h2 {
            color: #144886;
            font-size: 1.35rem;
            margin-bottom: 1rem;
        }

        .feature-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
        }

        .feature-item {
            background: rgba(21, 101, 192, 0.08);
            color: #0d47a1;
            border: 1px solid rgba(21, 101, 192, 0.12);
            border-radius: 30px;
            padding: 0.55rem 1.3rem;
            font-size: 0.95rem;
            font-weight: 600;
        }

        footer {
            margin-top: 2.4rem;
            font-size: 0.85rem;
            color: rgba(17, 52, 85, 0.7);
        }

        @media (max-width: 640px) {
            .container {
                padding: 2rem 1.4rem;
            }

            .page-button {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="badge"><span>📘</span> 2025 교육 소프트웨어 연구보고서 시연</div>
        <h1>우리 반 소통채널</h1>
        <p class="subtitle">“마음도 공부도 레벨업하는 캔디숍”</p>
        <p class="target-grade">대상 학년: 초등학교 5학년</p>

        <div class="buttons-container">
            <a class="page-button teacher-button" href="teacher.html">
                <span class="icon">👩‍🏫</span>
                교사 시연 화면으로 이동
            </a>
            <a class="page-button student-button" href="student.html">
                <span class="icon">👨‍🎓</span>
                학생 시연 화면으로 이동
            </a>
        </div>

        <section class="feature-section">
            <h2>주요 시연 기능</h2>
            <div class="feature-list">
                <span class="feature-item">학습 경험치 및 레벨 관리</span>
                <span class="feature-item">캔디 보상형 동기 부여 시스템</span>
                <span class="feature-item">학생 감정 체크 & 소통</span>
                <span class="feature-item">교사용 즉시 메시지·퀘스트 발송</span>
                <span class="feature-item">학생용 오늘의 목표 및 미션 확인</span>
            </div>
        </section>

        <footer>
            해당 USB는 로그인이 필요 없는 오프라인 시연용 버전입니다.
        </footer>
    </div>
</body>
</html>
